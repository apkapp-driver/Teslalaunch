<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MiDash</title>
    <meta name="theme-color" content="#141922" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet"
          href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="module"
            src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
</head>
<body>
    <main class="dash">
        <!-- Left: clock + media + car -->
        <section class="pane pane-left" id="paneLeft">
            <div class="widget clock" data-w="clock">
                <div id="time" class="time">--:--</div>
                <div id="date" class="date"></div>
            </div>

            <div class="widget card media" data-w="media">
                <div class="media-art" id="mediaArt">♪</div>
                <div class="media-info">
                    <div class="media-title" id="mediaTitle">Sin reproducción</div>
                    <div class="media-artist" id="mediaArtist">—</div>
                </div>
                <div class="media-controls">
                    <button class="icon-btn" data-media="prev" aria-label="Anterior">⏮</button>
                    <button class="icon-btn play" data-media="play" aria-label="Play/Pausa">▶</button>
                    <button class="icon-btn" data-media="next" aria-label="Siguiente">⏭</button>
                </div>
            </div>

            <div class="widget card car" data-w="car">
                <select id="carSelect" class="car-select" aria-label="Modelo de coche"></select>
                <div id="carMsg" class="car-msg" hidden></div>
                <model-viewer
                    id="carModel"
                    src="assets/car.glb"
                    loading="eager"
                    camera-controls
                    auto-rotate
                    auto-rotate-delay="0"
                    rotation-per-second="20deg"
                    interaction-prompt="none"
                    shadow-intensity="1"
                    exposure="1.1"
                    disable-zoom
                    aria-label="Modelo 3D del coche">
                </model-viewer>
                <div class="car-stats">
                    <span id="teslaPct" class="car-pct">--<small>%</small></span>
                    <span id="teslaRange" class="car-range"></span>
                    <span id="teslaBolt" class="car-bolt" hidden>⚡</span>
                </div>
                <div class="batt"><div id="teslaBar" class="batt-fill"></div></div>
            </div>
        </section>

        <!-- Center: map -->
        <section class="pane pane-map">
            <div id="map" class="map"></div>
            <form id="navForm" class="nav-form">
                <input id="navSearch" class="nav-input" type="text"
                       placeholder="¿A dónde vamos?" autocomplete="off" />
                <button class="nav-go" type="submit">Ir</button>
                <button id="navStop" class="nav-stop" type="button" hidden>✕</button>
            </form>
            <div id="favPlaces" class="fav-places">
                <button class="fav-chip" data-place="home">🏠 Casa</button>
                <button class="fav-chip" data-place="work">💼 Trabajo</button>
            </div>
            <div id="navInstruction" class="nav-instruction" hidden></div>
            <div id="alert" class="alert" hidden></div>
            <button id="fsBtn" class="map-btn fs-btn" type="button" title="Mapa a pantalla completa">⛶</button>
            <button id="layoutBtn" class="map-btn layout-btn" type="button" title="Elegir qué ver en cada ventana">▦</button>
            <div id="layoutDlg" class="dlg" hidden>
                <div class="dlg-title">Qué ver en cada ventana</div>
                <div id="layoutRows"></div>
                <div class="dlg-foot">
                    <button id="layoutReset" type="button">Restablecer</button>
                    <button id="layoutClose" type="button" class="primary">Listo</button>
                </div>
            </div>
        </section>

        <!-- Right: shortcuts -->
        <section class="pane pane-right" id="paneRight">
            <div class="widget" data-w="apps"><div id="apps" class="apps-grid"></div></div>
        </section>
    </main>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="app.js"></script>
</body>
</html>
