<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TeslaLaunch</title>
    <meta name="theme-color" content="#0B0E14" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
</head>
<body>
    <!-- Mapa de fondo a pantalla completa -->
    <div id="map" class="map-bg"></div>

    <!-- Botones flotantes globales -->
    <button id="fullscreenBtn" class="global-btn fullscreen-btn" title="Pantalla completa">⛶</button>
    <button id="themeBtn" class="global-btn theme-btn" title="Tema">🌓</button>

    <!-- Contenedor de ventanas flotantes -->
    <div id="desktop" class="desktop">
        <!-- Ventana Reloj -->
        <div class="window" data-win="clock" style="left:20px; top:20px; width:220px; height:120px;">
            <div class="win-header">
                <span class="win-title">Reloj</span>
                <div class="win-controls">
                    <button class="win-min" title="Minimizar">−</button>
                    <button class="win-close" title="Cerrar">×</button>
                </div>
            </div>
            <div class="win-body clock-body">
                <div id="time" class="time">--:--</div>
                <div id="date" class="date"></div>
            </div>
            <div class="resize-handle"></div>
        </div>

        <!-- Ventana Coche 3D -->
        <div class="window" data-win="car" style="left:20px; top:160px; width:300px; height:360px;">
            <div class="win-header">
                <span class="win-title">Coche</span>
                <div class="win-controls">
                    <select id="carSelect" class="car-select" aria-label="Modelo"></select>
                    <button class="win-min">−</button>
                    <button class="win-close">×</button>
                </div>
            </div>
            <div class="win-body car-body">
                <model-viewer
                    id="carModel"
                    src="assets/car.glb"
                    camera-controls auto-rotate auto-rotate-delay="0"
                    rotation-per-second="20deg" interaction-prompt="none"
                    shadow-intensity="1" exposure="1.1" disable-zoom
                    style="width:100%; height:100%; background:transparent;">
                </model-viewer>
                <div class="car-stats">
                    <span id="teslaPct" class="car-pct">--<small>%</small></span>
                    <span id="teslaRange" class="car-range"></span>
                    <span id="teslaBolt" class="car-bolt" hidden>⚡</span>
                </div>
                <div class="batt"><div id="teslaBar" class="batt-fill"></div></div>
            </div>
            <div class="resize-handle"></div>
        </div>

        <!-- Ventana Música -->
        <div class="window" data-win="media" style="left:20px; top:540px; width:300px; height:160px;">
            <div class="win-header">
                <span class="win-title">Música</span>
                <div class="win-controls">
                    <button class="win-min">−</button>
                    <button class="win-close">×</button>
                </div>
            </div>
            <div class="win-body media-body">
                <div class="media-art" id="mediaArt">♪</div>
                <div class="media-info">
                    <div class="media-title" id="mediaTitle">Sin reproducción</div>
                    <div class="media-artist" id="mediaArtist">—</div>
                </div>
                <div class="media-controls">
                    <button class="icon-btn" data-media="prev">⏮</button>
                    <button class="icon-btn play" data-media="play">▶</button>
                    <button class="icon-btn" data-media="next">⏭</button>
                </div>
            </div>
            <div class="resize-handle"></div>
        </div>

        <!-- Ventana Accesos directos -->
        <div class="window" data-win="apps" style="right:20px; top:20px; width:360px; height:520px;">
            <div class="win-header">
                <span class="win-title">Accesos</span>
                <div class="win-controls">
                    <button class="win-min">−</button>
                    <button class="win-close">×</button>
                </div>
            </div>
            <div class="win-body apps-body" id="apps"></div>
            <div class="resize-handle"></div>
        </div>

        <!-- Ventana Navegación -->
        <div class="window" data-win="nav" style="right:20px; bottom:20px; width:420px; height:220px;">
            <div class="win-header">
                <span class="win-title">Navegación</span>
                <div class="win-controls">
                    <button class="win-min">−</button>
                    <button class="win-close">×</button>
                </div>
            </div>
            <div class="win-body nav-body">
                <form id="navForm" class="nav-form-inline">
                    <input id="navSearch" class="nav-input" type="text" placeholder="¿A dónde vamos?" autocomplete="off" />
                    <button class="nav-go" type="submit">Ir</button>
                    <button id="navStop" class="nav-stop" type="button" hidden>✕</button>
                </form>
                <div id="favPlaces" class="fav-places-inline">
                    <button class="fav-chip" data-place="home">🏠 Casa</button>
                    <button class="fav-chip" data-place="work">💼 Trabajo</button>
                </div>
                <div id="navInstruction" class="nav-instruction-inline" hidden></div>
            </div>
            <div class="resize-handle"></div>
        </div>

        <!-- Banner de radar (flotante, no es ventana) -->
        <div id="alert" class="alert" hidden></div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="app.js"></script>
</body>
</html>
